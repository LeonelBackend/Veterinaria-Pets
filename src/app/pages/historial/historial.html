<div class="card p-4"><h1 class="h3">HU07 · Historial clínico</h1><label for="mascota" class="form-label">Seleccionar mascota</label><select id="mascota" class="form-select mb-3" [(ngModel)]="mascotaId">@for (m of servicio.mascotas; track m.id) {<option [ngValue]="m.id">{{m.nombre}} ({{m.especie}})</option>}</select>@if (atenciones.length === 0) {<div class="alert alert-info" role="status">No existen atenciones registradas para esta mascota.</div>} @else {<div class="table-responsive"><table class="table table-striped"><thead><tr><th>Fecha</th><th>Diagnóstico</th><th>Tratamiento</th><th>Observaciones</th></tr></thead><tbody>@for (a of atenciones; track a.id){<tr><td>{{a.fecha}}</td><td>{{a.diagnostico}}</td><td>{{a.tratamiento}}</td><td>{{a.observaciones || 'Sin observaciones'}}</td></tr>}</tbody></table></div>}</div>
